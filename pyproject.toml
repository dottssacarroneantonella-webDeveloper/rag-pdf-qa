[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pdf-qa"
version = "0.2.0"
description = "Domande e risposte sui documenti PDF con Retrieval-Augmented Generation (RAG): embedding, FAISS e LLM locale con Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rag", "llm", "faiss", "embeddings", "pdf", "ollama", "nlp"]
dependencies = [
    "numpy>=1.24",
    "pypdf>=4.0",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Embedding semantici multilingue (scarica il modello al primo uso, ~470 MB)
semantic = ["sentence-transformers>=2.7"]
faiss = ["faiss-cpu>=1.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0"]
all = ["rag-pdf-qa[semantic,faiss,api]"]

[project.scripts]
rag-pdf-qa = "rag_pdf_qa.cli:main"

[project.urls]
Repository = "https://github.com/dottssacarroneantonella-webDeveloper/rag-pdf-qa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
