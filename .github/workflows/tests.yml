name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installa il progetto (senza sentence-transformers, per restare leggeri)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[faiss,api,dev]"
      - name: Esegui i test
        run: pytest -v
